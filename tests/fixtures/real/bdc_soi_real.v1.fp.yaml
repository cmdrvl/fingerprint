fingerprint_id: bdc-soi-real.v1
format: html
assertions:
  - name: schedule_anchor_text
    node_text_regex:
      selector: p
      pattern: "(?i)investments\\s+at\\s+fair\\s+value\\s+consisted\\s+of\\s+the\\s+following"
      min_matches: 1
  - name: schedule_tables_present
    node_count:
      selector: table
      min: 1
extract:
  - name: schedule_region
    type: region
    anchor_selector: p
    anchor_text_regex: "(?i)investments\\s+at\\s+fair\\s+value\\s+consisted\\s+of\\s+the\\s+following"
    stop_selector: h1, h2, h3
    continue_past: []
    coalesce_by_as_of: false
    tokenized_byte_offsets: true
