[package]
name = "fingerprint"
version = "0.12.0"
edition = "2024"
authors = ["CMD+RVL Inc. <engineering@cmd.com>"]
description = "Content fingerprinting and document recognition system with DSL-based assertion engine"
license = "MIT"
repository = "https://github.com/cmdrvl/fingerprint"
readme = "README.md"
keywords = ["document", "recognition", "content", "fingerprint", "assertion"]
categories = ["command-line-utilities", "text-processing", "parsing"]

[dependencies]
clap = { version = "=4.5.60", features = ["derive"] }
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.143"
# "dates" only adds ExcelDateTime::as_datetime (used by `materialize` to render date cells in
# the workbook's own 1900/1904 system); it does not change Data's Display output.
calamine = { version = "=0.26.1", features = ["dates"] }
lopdf = "=0.34.0"
csv = "=1.3.1"
# Footer-only Parquet assertions (bd-yq3). Exactly the version cmdrvl-tabular resolves (60.2.0),
# with default features off: no arrow, no codecs, because footer metadata is never compressed.
parquet = { version = "=60.2.0", default-features = false }
# Streaming, namespace-aware XML for the `xml` format (bd-yq3). Exactly 0.31.0: the version
# calamine 0.26.1 already pulls in for XLSX, so this adds no new crate to the dependency tree.
# No default features are needed (NsReader is always available) and it never expands entities
# or fetches DTDs.
quick-xml = "=0.31.0"
blake3 = "=1.6.1"
# Keyed HMAC-SHA256 name markers for `peek` (bd-zwx). Same crates and versions rvl uses
# (hmac 0.12, sha2 0.10); both are already in Cargo.lock, so nothing new enters the tree.
hmac = "=0.12.1"
sha2 = "=0.10.9"
chrono = "=0.4.41"
regex = "=1.11.1"
serde_yaml = "=0.9.34"
globset = "=0.4.16"
futures = "=0.3.31"
scraper = "=0.22.0"
lol_html = "=3.0.2"
ego-tree = "=0.10.0"
zip = { version = "=2.4.2", default-features = false }
frankensearch-core = "=0.1.2"
frankensearch-embed = { version = "=0.1.2", default-features = false, features = ["hash"] }
frankensearch-lexical = "=0.1.0"

[dev-dependencies]
tempfile = "=3.25.0"
criterion = { version = "0.5", features = ["html_reports"] }
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[[bench]]
name = "assertion_throughput"
harness = false

[[bench]]
name = "pipeline_throughput"
harness = false

[[bench]]
name = "normalization"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
