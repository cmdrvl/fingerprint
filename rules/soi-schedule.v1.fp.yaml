fingerprint_id: soi-schedule.v1
format: html

assertions:
  - name: schedule_heading_text
    node_text_regex:
      selector: "h1, h2, div, p, span"
      pattern: "(?i)schedu\\s*les?\\s+of\\s+investments"
      min_matches: 1
  - name: schedule_tables_present
    node_count:
      selector: "table"
      min: 1

extract:
  - name: schedule_region
    type: region
    anchor_selector: "h1.soi, div[id] + hr + div[style*='min-height'], a[id^='T'] + p + p, p[style*='text-align:center'] > span"
    anchor_text_regex: "(?i)schedu\\s*les?\\s+of\\s+investments"
    stop_selector: "h1, h2.notes, div[id] + hr + div[style*='min-height'], hr + div[style*='min-height'] + div, a[id^='T'] + p + p"
    stop_text_regex: "(?i)(schedu\\s*les?\\s+of\\s+investments|notes|derivative\\s+instruments|item\\s+[0-9])"
    continue_past:
      - "(?i)(\\(continued\\)|\\bcontinued\\b)"
